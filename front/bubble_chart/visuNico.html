<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Olympic Bubble Chart</title>

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v6.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  
  .controls {
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  .control-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  label {
    margin-right: 10px;
    font-weight: bold;
  }
  
  .slider-container {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
  }
  
  #yearSlider {
    width: 400px;
    cursor: pointer;
  }
  
  #yearDisplay {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    min-width: 50px;
  }
  
  .season-buttons {
    display: flex;
    gap: 10px;
  }
  
  .season-btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid #333;
    border-radius: 5px;
    background-color: white;
    cursor: pointer;
    transition: all 0.3s;
  }
  
  .season-btn:hover {
    background-color: #f0f0f0;
  }
  
  .season-btn.active {
    background-color: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }
  
  .bubbles {
    stroke-width: 2px;
    stroke: white;
    opacity: 0.7;
  }
  
  .bubbles:hover {
    stroke: black;
    opacity: 1;
  }
  
  .axis-label {
    font-size: 14px;
    font-weight: bold;
  }
  
  .title {
    font-size: 18px;
    font-weight: bold;
  }
  
  .legend {
    margin-top: 20px;
    padding: 15px;
    background-color: #f8f9fa;
    border-radius: 5px;
    display: inline-block;
  }
  
  .legend-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 14px;
  }
  
  .legend-item {
    display: inline-flex;
    align-items: center;
    margin-right: 20px;
    margin-bottom: 5px;
  }
  
  .legend-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    margin-right: 8px;
    border: 2px solid white;
  }
  
  .legend-label {
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>Visualisation des Jeux Olympiques - Bubble Chart</h1>

<!-- Controls for year and season selection -->
<div class="controls">
  <div class="control-row">
    <label for="yearSlider">Année:</label>
    <div class="slider-container">
      <input type="range" id="yearSlider" min="1896" max="2016" value="2016" step="2">
      <span id="yearDisplay">2016</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Saison:</label>
    <div class="season-buttons">
      <button class="season-btn active" data-season="Summer">Été (Summer)</button>
      <button class="season-btn" data-season="Winter">Hiver (Winter)</button>
    </div>
  </div>
</div>

<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>

<!-- Legend for continents -->
<div class="legend">
  <div class="legend-title">Légende - Continents:</div>
  <div style="display: flex; flex-wrap: wrap;">
    <div class="legend-item">
      <div class="legend-color" style="background-color: #e74c3c;"></div>
      <span class="legend-label">Africa</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #3498db;"></div>
      <span class="legend-label">Americas</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #f39c12;"></div>
      <span class="legend-label">Asia</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #2ecc71;"></div>
      <span class="legend-label">Europe</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #9b59b6;"></div>
      <span class="legend-label">Oceania</span>
    </div>
  </div>
</div>

<script type="module">

// Import des fonctions depuis operations.js
import * as ops from '../utils/operations.js';

// set the dimensions and margins of the graph
const margin = {top: 100, right: 20, bottom: 60, left: 80},
    width = 1000 - margin.left - margin.right,
    height = 600 - margin.top - margin.bottom;

// append the svg object to the body of the page
const svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Global variables to store data
let athleteData, populationData;
let availableYears = [];
let currentSeason = "Summer";

// Load both CSV files using operations.js
ops.loadData(
  "../../CSV_Dest/athlete_events_opti.csv",
  "../../CSV_Dest/population-1900-2016.csv"
).then(function(loadedData) {
  athleteData = loadedData.athleteData;
  populationData = loadedData.populationData;
  
  // Get unique years from athlete data
  availableYears = ops.getAvailableYears(athleteData);
  
  // Setup slider
  const yearSlider = d3.select("#yearSlider");
  const yearDisplay = d3.select("#yearDisplay");
  
  yearSlider
    .attr("min", d3.min(availableYears))
    .attr("max", d3.max(availableYears))
    .property("value", 2016);
  
  yearDisplay.text(2016);
  
  // Update chart when slider changes
  yearSlider.on("input", function() {
    const selectedYear = +this.value;
    // Find closest available year using operations.js
    const closestYear = ops.findClosestYear(availableYears, selectedYear);
    yearDisplay.text(closestYear);
    updateChart(closestYear, currentSeason);
  });
  
  // Setup season buttons
  const seasonButtons = d3.selectAll(".season-btn");
  seasonButtons.on("click", function() {
    // Remove active class from all buttons
    seasonButtons.classed("active", false);
    // Add active class to clicked button
    d3.select(this).classed("active", true);
    // Update current season
    currentSeason = this.dataset.season;
    // Update chart
    const currentYear = +yearDisplay.text();
    updateChart(currentYear, currentSeason);
  });
  
  // Initial chart render
  updateChart(2016, currentSeason);
}).catch(function(error) {
  console.error("Error loading files:", error);
  document.getElementById("my_dataviz").innerHTML = 
    "<p style='color: red; font-weight: bold;'>Erreur de chargement des fichiers CSV. Vérifiez les chemins des fichiers et la console.</p>";
});

function updateChart(selectedYear, season) {
  // Utilisation des fonctions de operations.js pour préparer les données
  const chartData = ops.prepareChartData(athleteData, populationData, selectedYear, season);
  const combinedData = chartData.data;
  
  // Vérifier s'il y a des données
  if (combinedData.length === 0) {
    svg.selectAll("*").remove();
    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height / 2)
      .attr("text-anchor", "middle")
      .style("font-size", "16px")
      .text(`Aucune donnée disponible pour ${season} ${selectedYear}`);
    return;
  }
  
  // Clear previous chart
  svg.selectAll("*").remove();
  
  // Add X axis (participants)
  const maxParticipants = d3.max(combinedData, d => d.participants);
  const x = d3.scaleLinear()
    .domain([0, maxParticipants * 1.1])
    .range([0, width]);
  svg.append("g")
    .attr("transform", `translate(0, ${height})`)
    .call(d3.axisBottom(x));
  
  // Add X axis label
  svg.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", height + 40)
    .text("Nombre de participants");
  
  // Add Y axis (population)
  const maxPopulation = d3.max(combinedData, d => d.population);
  const y = d3.scaleLinear()
    .domain([0, maxPopulation * 1.1])
    .range([height, 0]);
  svg.append("g")
    .call(d3.axisLeft(y).tickFormat(d3.format(".2s")));
  
  // Add Y axis label
  svg.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2)
    .attr("y", -50)
    .text("Nombre d'habitants");
  
  // Add title
  const seasonText = season === "Summer" ? "Été" : "Hiver";
  svg.append("text")
    .attr("class", "title")
    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", -10)
    .text(`Jeux Olympiques ${seasonText} ${selectedYear}`);
  
  // Add a scale for bubble size (medals)
  const minMedals = d3.min(combinedData, d => d.medals);
  const maxMedals = d3.max(combinedData, d => d.medals);
  const z = d3.scaleSqrt()
    .domain([minMedals, maxMedals])
    .range([3, 40]);
  
  // Add a scale for bubble color by continent
  const continentColors = {
    "Africa": "#9b59b6",      // Violet 
    "Americas": "#3498db",    // Bleu 
    "Asia": "#e74c3c",        // Rouge 
    "Europe": "#2ecc71",      // Vert 
    "Oceania": "#f39c12",     // Orange  
    "Unknown": "#95a5a6"      // Gris
  };
  
  const myColor = d3.scaleOrdinal()
    .domain(["Africa", "Americas", "Asia", "Europe", "Oceania", "Unknown"])
    .range(["#9b59b6", "#3498db", "#e74c3c", "#2ecc71", "#f39c12", "#95a5a6"]);
  
  // Create a tooltip div that is hidden by default:
  const tooltip = d3.select("body")
    .append("div")
      .style("opacity", 0)
      .attr("class", "tooltip")
      .style("position", "absolute")
      .style("background-color", "black")
      .style("border-radius", "5px")
      .style("padding", "10px")
      .style("color", "white")
      .style("pointer-events", "none");
  
  // Create 3 functions to show / update / hide the tooltip
  const showTooltip = function(event, d) {
    tooltip
      .transition()
      .duration(200);
    tooltip
      .style("opacity", 1)
      .html(`<strong>${d.noc}</strong> (${d.continent})<br/>
             Participants: ${d.participants}<br/>
             Médailles: ${d.medals}<br/>
             Population: ${d3.format(",")(Math.round(d.population))}`)
      .style("left", (event.pageX + 15) + "px")
      .style("top", (event.pageY - 28) + "px");
  }
  
  const moveTooltip = function(event, d) {
    tooltip
      .style("left", (event.pageX + 15) + "px")
      .style("top", (event.pageY - 28) + "px");
  }
  
  const hideTooltip = function(event, d) {
    tooltip
      .transition()
      .duration(200)
      .style("opacity", 0);
  }
  
  // Add dots
  svg.append('g')
    .selectAll("circle")
    .data(combinedData)
    .join("circle")
      .attr("class", "bubbles")
      .attr("cx", d => x(d.participants))
      .attr("cy", d => y(d.population))
      .attr("r", d => z(d.medals))
      .style("fill", d => myColor(d.continent))
    // Trigger the functions
    .on("mouseover", showTooltip)
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip);
}

</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Olympic Bubble Chart</title>

<!-- Load d3.js -->
<script src="https://d3js.org/d3.v6.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  
  .controls {
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  
  .control-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  label {
    margin-right: 10px;
    font-weight: bold;
  }
  
  .slider-container {
    display: flex;
    align-items: center;
    gap: 15px;
    flex: 1;
  }
  
  #yearSlider {
    width: 400px;
    cursor: pointer;
  }
  
  #yearDisplay {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    min-width: 50px;
  }
  
  .nav-btn {
    padding: 8px 15px;
    font-size: 18px;
    font-weight: bold;
    border: 2px solid #333;
    border-radius: 5px;
    background-color: white;
    cursor: pointer;
    transition: all 0.3s;
    min-width: 45px;
  }
  
  .nav-btn:hover:not(:disabled) {
    background-color: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }
  
  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  
  .season-buttons {
    display: flex;
    gap: 10px;
  }
  
  .season-btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    border: 2px solid #333;
    border-radius: 5px;
    background-color: white;
    cursor: pointer;
    transition: all 0.3s;
  }
  
  .season-btn:hover {
    background-color: #f0f0f0;
  }
  
  .season-btn.active {
    background-color: #4CAF50;
    color: white;
    border-color: #4CAF50;
  }
  
  .bubbles {
    stroke-width: 0.5px;
    stroke: white;
    opacity: 0.7;
  }
  
  .bubbles:hover {
    stroke: black;
    opacity: 1;
  }
  
  .axis-label {
    font-size: 14px;
    font-weight: bold;
  }
  
  .title {
    font-size: 18px;
    font-weight: bold;
  }
  
  /* Style pour les axes - fond blanc pour qu'ils soient bien visibles */
  .x-axis path,
  .x-axis line,
  .y-axis path,
  .y-axis line {
    stroke: #333;
    stroke-width: 1.5px;
  }
  
  .x-axis text,
  .y-axis text {
    fill: #333;
    font-size: 11px;
  }
  
  .legend {
    margin-top: 20px;
    padding: 15px;
    background-color: #f8f9fa;
    border-radius: 5px;
    display: inline-block;
  }
  
  .legend-title {
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 14px;
  }
  
  .legend-item {
    display: inline-flex;
    align-items: center;
    margin-right: 20px;
    margin-bottom: 5px;
  }
  
  .legend-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    margin-right: 8px;
    border: 2px solid white;
  }
  
  .legend-label {
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>Visualisation des Jeux Olympiques - Bubble Chart</h1>

<!-- Controls for year and season selection -->
<div class="controls">
  <div class="control-row">
    <label for="yearSlider">Année:</label>
    <div class="slider-container">
      <button class="nav-btn" id="prevBtn">◀</button>
      <input type="range" id="yearSlider" min="1896" max="2016" value="2016" step="2">
      <button class="nav-btn" id="nextBtn">▶</button>
      <span id="yearDisplay">2016</span>
    </div>
  </div>
  
  <div class="control-row">
    <label>Saison:</label>
    <div class="season-buttons">
      <button class="season-btn active" data-season="Summer">Été (Summer)</button>
      <button class="season-btn" data-season="Winter">Hiver (Winter)</button>
    </div>
  </div>
</div>

<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>

<!-- Legend for continents -->
<div class="legend">
  <div class="legend-title">Légende - Continents:</div>
  <div style="display: flex; flex-wrap: wrap;">
    <div class="legend-item">
      <div class="legend-color" style="background-color: #e74c3c;"></div>
      <span class="legend-label">Africa</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #3498db;"></div>
      <span class="legend-label">Americas</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #f39c12;"></div>
      <span class="legend-label">Asia</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #2ecc71;"></div>
      <span class="legend-label">Europe</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #9b59b6;"></div>
      <span class="legend-label">Oceania</span>
    </div>
  </div>
</div>

<script type="module">

// Import des fonctions depuis operations.js
import * as ops from '../utils/operations.js';

// set the dimensions and margins of the graph
const margin = {top: 100, right: 20, bottom: 60, left: 80},
    width = 1000 - margin.left - margin.right,
    height = 600 - margin.top - margin.bottom;

// append the svg object to the body of the page
const svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Global variables to store data
let athleteData, populationData;
let allYears = [];
let summerYears = [];
let winterYears = [];
let currentSeason = "Summer";

// Variables globales pour les échelles et éléments du graphique
let xScale, yScale, zScale, colorScale;
let xAxisGroup, yAxisGroup, titleElement, bubblesGroup;
let tooltip;

// Variables pour les échelles fixes (calculées une fois pour toute la saison)
let globalMaxParticipants = {Summer: 0, Winter: 0};
let globalMaxPopulation = {Summer: 0, Winter: 0};
let globalMaxMedals = {Summer: 0, Winter: 0};
let globalMinMedals = {Summer: Infinity, Winter: Infinity};

// Load both CSV files using operations.js
ops.loadData(
  "../../CSV_Dest/athlete_events_opti.csv",
  "../../CSV_Dest/population-1900-2016.csv"
).then(function(loadedData) {
  athleteData = loadedData.athleteData;
  populationData = loadedData.populationData;
  
  // Get unique years from athlete data
  allYears = ops.getAvailableYears(athleteData);
  
  // Séparer les années par saison
  summerYears = [...new Set(athleteData.filter(d => d.Season === "Summer").map(d => d.Year))].sort((a, b) => a - b);
  winterYears = [...new Set(athleteData.filter(d => d.Season === "Winter").map(d => d.Year))].sort((a, b) => a - b);
  
  // Calculer les échelles globales pour chaque saison
  ["Summer", "Winter"].forEach(season => {
    const seasonYears = season === "Summer" ? summerYears : winterYears;
    seasonYears.forEach(year => {
      const chartData = ops.prepareChartData(athleteData, populationData, year, season);
      const data = chartData.data;
      
      if (data.length > 0) {
        const maxParticipants = d3.max(data, d => d.participants);
        const maxPopulation = d3.max(data, d => d.population);
        const maxMedals = d3.max(data, d => d.medals);
        const minMedals = d3.min(data, d => d.medals);
        
        if (maxParticipants > globalMaxParticipants[season]) {
          globalMaxParticipants[season] = maxParticipants;
        }
        if (maxPopulation > globalMaxPopulation[season]) {
          globalMaxPopulation[season] = maxPopulation;
        }
        if (maxMedals > globalMaxMedals[season]) {
          globalMaxMedals[season] = maxMedals;
        }
        if (minMedals < globalMinMedals[season]) {
          globalMinMedals[season] = minMedals;
        }
      }
    });
  });
  
  // Setup slider
  const yearSlider = d3.select("#yearSlider");
  const yearDisplay = d3.select("#yearDisplay");
  
  // Fonction pour mettre à jour le slider selon la saison
  function updateSliderForSeason(season) {
    const availableYears = season === "Summer" ? summerYears : winterYears;
    
    if (availableYears.length === 0) {
      console.error("No years available for season:", season);
      return;
    }
    
    const minYear = d3.min(availableYears);
    const maxYear = d3.max(availableYears);
    
    yearSlider
      .attr("min", minYear)
      .attr("max", maxYear)
      .property("value", minYear);
    
    yearDisplay.text(minYear);
    
    // Ajouter des datalist pour les années disponibles
    let datalistId = "year-options";
    d3.select("#" + datalistId).remove();
    
    const datalist = d3.select("body").append("datalist").attr("id", datalistId);
    yearSlider.attr("list", datalistId);
    
    availableYears.forEach(year => {
      datalist.append("option").attr("value", year);
    });
    
    return minYear;
  }
  
  // Initialiser le slider pour la saison Summer
  const initialYear = updateSliderForSeason(currentSeason);
  
  // Fonction pour obtenir l'index de l'année courante
  function getCurrentYearIndex() {
    const availableYears = currentSeason === "Summer" ? summerYears : winterYears;
    const currentYear = +yearSlider.property("value");
    return availableYears.indexOf(currentYear);
  }
  
  // Fonction pour mettre à jour les boutons de navigation
  function updateNavigationButtons() {
    const availableYears = currentSeason === "Summer" ? summerYears : winterYears;
    const currentYear = +yearSlider.property("value");
    const currentIndex = availableYears.indexOf(currentYear);
    
    d3.select("#prevBtn").property("disabled", currentIndex <= 0);
    d3.select("#nextBtn").property("disabled", currentIndex >= availableYears.length - 1);
  }
  
  // Update chart when slider changes
  yearSlider.on("input", function() {
    const selectedYear = +this.value;
    const availableYears = currentSeason === "Summer" ? summerYears : winterYears;
    // Find closest available year using operations.js
    const closestYear = ops.findClosestYear(availableYears, selectedYear);
    yearDisplay.text(closestYear);
    updateChart(closestYear, currentSeason);
    updateNavigationButtons();
  });
  
  // Bouton précédent
  d3.select("#prevBtn").on("click", function() {
    const availableYears = currentSeason === "Summer" ? summerYears : winterYears;
    const currentYear = +yearSlider.property("value");
    const currentIndex = availableYears.indexOf(currentYear);
    
    if (currentIndex > 0) {
      const newYear = availableYears[currentIndex - 1];
      yearSlider.property("value", newYear);
      yearDisplay.text(newYear);
      updateChart(newYear, currentSeason);
      updateNavigationButtons();
    }
  });
  
  // Bouton suivant
  d3.select("#nextBtn").on("click", function() {
    const availableYears = currentSeason === "Summer" ? summerYears : winterYears;
    const currentYear = +yearSlider.property("value");
    const currentIndex = availableYears.indexOf(currentYear);
    
    if (currentIndex < availableYears.length - 1) {
      const newYear = availableYears[currentIndex + 1];
      yearSlider.property("value", newYear);
      yearDisplay.text(newYear);
      updateChart(newYear, currentSeason);
      updateNavigationButtons();
    }
  });
  
  // Setup season buttons
  const seasonButtons = d3.selectAll(".season-btn");
  seasonButtons.on("click", function() {
    // Remove active class from all buttons
    seasonButtons.classed("active", false);
    // Add active class to clicked button
    d3.select(this).classed("active", true);
    // Update current season
    currentSeason = this.dataset.season;
    // Mettre à jour le slider pour la nouvelle saison
    const newYear = updateSliderForSeason(currentSeason);
    // Update chart
    updateChart(newYear, currentSeason);
    updateNavigationButtons();
  });
  
  // Créer le tooltip une seule fois
  tooltip = d3.select("body")
    .append("div")
      .style("opacity", 0)
      .attr("class", "tooltip")
      .style("position", "absolute")
      .style("background-color", "black")
      .style("border-radius", "5px")
      .style("padding", "10px")
      .style("color", "white")
      .style("pointer-events", "none");
  
  // Initial chart render
  updateChart(initialYear, currentSeason);
  updateNavigationButtons();
}).catch(function(error) {
  console.error("Error loading files:", error);
  document.getElementById("my_dataviz").innerHTML = 
    "<p style='color: red; font-weight: bold;'>Erreur de chargement des fichiers CSV. Vérifiez les chemins des fichiers et la console.</p>";
});

// Create 3 functions to show / update / hide the tooltip
const showTooltip = function(event, d) {
  tooltip
    .transition()
    .duration(200);
  tooltip
    .style("opacity", 1)
    .html(`<strong>${d.noc}</strong> (${d.continent})<br/>
           Participants: ${d.participants}<br/>
           Médailles: ${d.medals}<br/>
           Population: ${d3.format(",")(Math.round(d.population))}`)
    .style("left", (event.pageX + 15) + "px")
    .style("top", (event.pageY - 28) + "px");
}

const moveTooltip = function(event, d) {
  tooltip
    .style("left", (event.pageX + 15) + "px")
    .style("top", (event.pageY - 28) + "px");
}

const hideTooltip = function(event, d) {
  tooltip
    .transition()
    .duration(200)
    .style("opacity", 0);
}

// Initialize chart elements
function initializeChart() {
  // Add bubbles group FIRST (so it's behind everything else)
  bubblesGroup = svg.append('g')
    .attr("class", "bubbles-group");
  
  // Add a white background rectangle for X axis area
  svg.append("rect")
    .attr("class", "x-axis-bg")
    .attr("x", -10)
    .attr("y", height - 2)
    .attr("width", width + 20)
    .attr("height", 50)
    .attr("fill", "white");
  
  // Add a white background rectangle for Y axis area
  svg.append("rect")
    .attr("class", "y-axis-bg")
    .attr("x", -80)
    .attr("y", -10)
    .attr("width", 80)
    .attr("height", height + 20)
    .attr("fill", "white");
  
  // Add a white background rectangle for the corner between axes
  svg.append("rect")
    .attr("class", "corner-axis-bg")
    .attr("x", -80)
    .attr("y", height - 2)
    .attr("width", 80)
    .attr("height", 50)
    .attr("fill", "white");
  
  // Add X axis group (after bubbles, so it's on top)
  xAxisGroup = svg.append("g")
    .attr("class", "x-axis")
    .attr("transform", `translate(0, ${height})`);
  
  // Add X axis label
  svg.append("text")
    .attr("class", "axis-label x-label")
    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", height + 40)
    .text("Nombre de participants");
  
  // Add Y axis group (after bubbles, so it's on top)
  yAxisGroup = svg.append("g")
    .attr("class", "y-axis");
  
  // Add Y axis label
  svg.append("text")
    .attr("class", "axis-label y-label")
    .attr("text-anchor", "middle")
    .attr("transform", "rotate(-90)")
    .attr("x", -height / 2)
    .attr("y", -50)
    .text("Nombre de médailles");
  
  // Add title
  titleElement = svg.append("text")
    .attr("class", "title")
    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", -10);
  
  // Initialize color scale
  colorScale = d3.scaleOrdinal()
    .domain(["Africa", "Americas", "Asia", "Europe", "Oceania", "Unknown"])
    .range(["#9b59b6", "#3498db", "#e74c3c", "#2ecc71", "#f39c12", "#95a5a6"]);
}

function updateChart(selectedYear, season) {
  // Utilisation des fonctions de operations.js pour préparer les données
  const chartData = ops.prepareChartData(athleteData, populationData, selectedYear, season);
  const combinedData = chartData.data;
  
  // Vérifier s'il y a des données
  if (combinedData.length === 0) {
    svg.selectAll("*").remove();
    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height / 2)
      .attr("text-anchor", "middle")
      .style("font-size", "16px")
      .text(`Aucune donnée disponible pour ${season} ${selectedYear}`);
    return;
  }
  
  // Initialize chart elements if not already done
  if (!xAxisGroup) {
    initializeChart();
  }
  
  // Utiliser les échelles globales fixes pour la saison
  xScale = d3.scaleLinear()
    .domain([0, globalMaxParticipants[season] * 1.1])
    .range([0, width]);
  
  yScale = d3.scaleLinear()
    .domain([0, globalMaxMedals[season] * 1.1])
    .range([height, 0]);
  
  zScale = d3.scaleSqrt()
    .domain([0, globalMaxPopulation[season]])
    .range([5, 50]);
  
  // Update axes with transition
  xAxisGroup.transition()
    .duration(750)
    .call(d3.axisBottom(xScale));
  
  yAxisGroup.transition()
    .duration(750)
    .call(d3.axisLeft(yScale));
  
  // Update title
  const seasonText = season === "Summer" ? "Été" : "Hiver";
  titleElement.text(`Jeux Olympiques ${seasonText} ${selectedYear}`);
  
  // Trier les données par population (du plus grand au plus petit)
  // Les plus grosses bulles seront dessinées en premier (arrière-plan)
  const sortedData = combinedData.sort((a, b) => b.population - a.population);
  
  // Update bubbles with smooth transitions
  const bubbles = bubblesGroup
    .selectAll("circle")
    .data(sortedData, d => d.noc); // Use noc as key for object constancy
  
  // Exit: remove old bubbles
  bubbles.exit()
    .transition()
    .duration(750)
    .attr("r", 0)
    .style("opacity", 0)
    .remove();
  
  // Enter: add new bubbles
  const bubblesEnter = bubbles.enter()
    .append("circle")
    .attr("class", "bubbles")
    .attr("cx", d => xScale(d.participants))
    .attr("cy", d => yScale(d.medals))
    .attr("r", 0)
    .style("fill", d => colorScale(d.continent))
    .style("opacity", 0);
  
  // Update + Enter: transition all bubbles to new positions and sizes
  bubblesEnter.merge(bubbles)
    .on("mouseover", showTooltip)
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip)
    .transition()
    .duration(750)
    .attr("cx", d => xScale(d.participants))
    .attr("cy", d => yScale(d.medals))
    .attr("r", d => zScale(d.population))
    .style("fill", d => colorScale(d.continent))
    .style("opacity", 0.7);
}

</script>
</body>
</html>

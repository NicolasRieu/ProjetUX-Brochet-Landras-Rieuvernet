<body>

<h1>Visualisation des Jeux Olympiques - Bubble Chart</h1>

<!-- Main container with chart and filters -->
<div class="main-container">
  <!-- Chart section -->
  <div class="chart-section">
    <!-- Controls for year and season selection -->
    <div class="controls">
      <div class="control-row">
        <label for="yearSlider">Année:</label>
        <div class="slider-container">
          <button class="nav-btn" id="prevBtn">◀</button>
          <input type="range" id="yearSlider" min="1896" max="2016" value="2016" step="2">
          <button class="nav-btn" id="nextBtn">▶</button>
          <span id="yearDisplay">2016</span>
          <button class="play-btn" id="playBackwardBtn" title="Lecture arrière">⏮</button>
          <button class="play-btn" id="playForwardBtn" title="Lecture avant">⏯</button>
        </div>
      </div>
      
      <div class="control-row">
        <label>Saison:</label>
        <div class="season-buttons">
          <button class="season-btn active" data-season="Summer">Été (Summer)</button>
          <button class="season-btn" data-season="Winter">Hiver (Winter)</button>
        </div>
      </div>
    </div>

    <!-- Create a div where the graph will take place -->
    <div id="my_dataviz"></div>
  </div>
  
  <!-- Filter section -->
  <div class="filter-section">
    <!-- Continent filters -->
    <div class="continent-filters">
      <h3>🌍 Filtrer par Continent</h3>
      <div class="continent-list" id="continentList">
        <!-- Continent buttons will be dynamically added here -->
      </div>
    </div>
    
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
    
    <!-- Country filters -->
    <h3>🏁 Filtrer par Pays</h3>
    <div class="filter-controls">
      <input type="text" class="search-input" id="countrySearchInput" placeholder="Rechercher un pays...">
      <button class="filter-btn" id="deselectAllBtn">Tout désélectionner</button>
    </div>
    <div class="country-list" id="countryList">
      <!-- Country buttons will be dynamically added here -->
    </div>
  </div>
</div>

<script type="module">

// Import des fonctions depuis operations.js
import * as ops from '../utils/operations.js';

// set the dimensions and margins of the graph
const margin = {top: 100, right: 20, bottom: 60, left: 80},
    width = 1000 - margin.left - margin.right,
    height = 600 - margin.top - margin.bottom;

// append the svg object to the body of the page
const svgContainer = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom);

// Define clip path to prevent bubbles from overflowing the chart area
svgContainer.append("defs").append("clipPath")
  .attr("id", "chart-area-clip")
  .append("rect")
  .attr("x", 0)
  .attr("y", 0)
  .attr("width", width)
  .attr("height", height);

const svg = svgContainer
  .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Global variables to store data
let athleteData, populationData;
let allYears = [];
let summerYears = [];
let winterYears = [];
let currentSeason = "Summer";

// Variables globales pour les échelles et éléments du graphique
let xScale, yScale, zScale, colorScale;
let xAxisGroup, yAxisGroup, titleElement, bubblesGroup;
let tooltip;

// Variables pour le zoom
let currentZoomTransform = d3.zoomIdentity;

// Filtres actifs pour les continents (aucun par défaut = afficher tous)
let activeContinents = new Set();
let continentFilterEnabled = false; // Indique si le filtre par continent est activé

// Filtres actifs pour les pays (aucun par défaut = afficher tous)
let activeCountries = new Set();
let allAvailableCountries = new Set();
let countryFilterEnabled = false; // Indique si le filtre par pays est activé

// Variable pour garder la trace de la bulle sélectionnée
let selectedBubble = null;

// Variables pour la lecture automatique
let autoPlayInterval = null;
let autoPlayDirection = 1; // 1 pour avant, -1 pour arrière
let autoPlaySpeed = 2000; // Vitesse en millisecondes (2 secondes par défaut)

// Échelles calculées selon les filtres de continents actifs
let filteredMaxParticipants = {Summer: 0, Winter: 0};
let filteredMaxPopulation = {Summer: 0, Winter: 0};
let filteredMaxMedals = {Summer: 0, Winter: 0};

// Années disponibles selon les filtres (initialement égales aux années globales)
let filteredSummerYears = [];
let filteredWinterYears = [];

// Mapping NOC (Olympic codes) to ISO 3166-1 alpha-2 (flag codes)
const nocToIso2 = {
  "AFG": "af", "AHO": "an", "ALB": "al", "ALG": "dz", "AND": "ad", 
  "ANG": "ao", "ANT": "ag", "ARG": "ar", "ARM": "am", "ARU": "aw",
  "ASA": "as", "AUS": "au", "AUT": "at", "AZE": "az", "BAH": "bs",
  "BAN": "bd", "BAR": "bb", "BDI": "bi", "BEL": "be", "BEN": "bj",
  "BER": "bm", "BHU": "bt", "BIH": "ba", "BIZ": "bz", "BLR": "by",
  "BOL": "bo", "BOT": "bw", "BRA": "br", "BRN": "bn", "BRU": "bn",
  "BUL": "bg", "BUR": "bf", "CAF": "cf", "CAM": "kh", "CAN": "ca",
  "CAY": "ky", "CGO": "cg", "CHA": "td", "CHI": "cl", "CHN": "cn",
  "CIV": "ci", "CMR": "cm", "COD": "cd", "COK": "ck", "COL": "co",
  "COM": "km", "CPV": "cv", "CRC": "cr", "CRO": "hr", "CUB": "cu",
  "CYP": "cy", "CZE": "cz", "DEN": "dk", "DJI": "dj", "DMA": "dm",
  "DOM": "do", "ECU": "ec", "EGY": "eg", "ERI": "er", "ESA": "sv",
  "ESP": "es", "EST": "ee", "ETH": "et", "FIJ": "fj", "FIN": "fi",
  "FRA": "fr", "FSM": "fm", "GAB": "ga", "GAM": "gm", "GBR": "gb",
  "GBS": "gw", "GEO": "ge", "GEQ": "gq", "GER": "de", "GHA": "gh",
  "GRE": "gr", "GRN": "gd", "GUA": "gt", "GUI": "gn", "GUM": "gu",
  "GUY": "gy", "HAI": "ht", "HKG": "hk", "HON": "hn", "HUN": "hu",
  "INA": "id", "IND": "in", "IRI": "ir", "IRL": "ie", "IRQ": "iq",
  "ISL": "is", "ISR": "il", "ISV": "vi", "ITA": "it", "IVB": "vg",
  "JAM": "jm", "JOR": "jo", "JPN": "jp", "KAZ": "kz", "KEN": "ke",
  "KGZ": "kg", "KIR": "ki", "KOR": "kr", "KSA": "sa", "KUW": "kw",
  "LAO": "la", "LAT": "lv", "LBA": "ly", "LBR": "lr", "LCA": "lc",
  "LES": "ls", "LIB": "lb", "LIE": "li", "LTU": "lt", "LUX": "lu",
  "MAD": "mg", "MAR": "ma", "MAS": "my", "MAW": "mw", "MDA": "md",
  "MDV": "mv", "MEX": "mx", "MGL": "mn", "MHL": "mh", "MKD": "mk",
  "MLI": "ml", "MLT": "mt", "MNE": "me", "MON": "mc", "MOZ": "mz",
  "MRI": "mu", "MTN": "mr", "MYA": "mm", "NAM": "na", "NCA": "ni",
  "NED": "nl", "NEP": "np", "NGR": "ng", "NIG": "ne", "NOR": "no",
  "NRU": "nr", "NZL": "nz", "OMA": "om", "PAK": "pk", "PAN": "pa",
  "PAR": "py", "PER": "pe", "PHI": "ph", "PLE": "ps", "PLW": "pw",
  "PNG": "pg", "POL": "pl", "POR": "pt", "PRK": "kp", "PUR": "pr",
  "QAT": "qa", "ROU": "ro", "RSA": "za", "RUS": "ru", "RWA": "rw",
  "SAM": "ws", "SEN": "sn", "SEY": "sc", "SIN": "sg", "SKN": "kn",
  "SLE": "sl", "SLO": "si", "SMR": "sm", "SOL": "sb", "SOM": "so",
  "SRB": "rs", "SRI": "lk", "STP": "st", "SUD": "sd", "SUI": "ch",
  "SUR": "sr", "SVK": "sk", "SWE": "se", "SWZ": "sz", "SYR": "sy",
  "TAN": "tz", "TGA": "to", "THA": "th", "TJK": "tj", "TKM": "tm",
  "TLS": "tl", "TOG": "tg", "TPE": "tw", "TTO": "tt", "TUN": "tn",
  "TUR": "tr", "TUV": "tv", "UAE": "ae", "UGA": "ug", "UKR": "ua",
  "URU": "uy", "USA": "us", "UZB": "uz", "VAN": "vu", "VEN": "ve",
  "VIE": "vn", "VIN": "vc", "YEM": "ye", "ZAM": "zm", "ZIM": "zw",
  // Codes historiques
  "TCH": "cz", "URS": "ru", "FRG": "de", "GDR": "de", "YUG": "rs",
  "SCG": "rs", "EUN": "ru", "BOH": "cz"
};

// Function to convert NOC to ISO2 for flags
function getNocFlag(noc) {
  return nocToIso2[noc] || noc.toLowerCase().substring(0, 2);
}

// Fonction pour créer un mapping NOC -> Nom de pays depuis les données de population
function createCountryNameMapping(populationData) {
  const mapping = new Map();
  
  // Créer le mapping Code -> Entity (nom du pays) depuis les données de population
  populationData.forEach(d => {
    if (d.Code && d.Entity && !mapping.has(d.Code)) {
      mapping.set(d.Code, d.Entity);
    }
  });
  
  return mapping;
}

// Fonction pour initialiser la liste des pays
function initializeCountryList(athleteData, populationData) {
  console.log("Initializing country list..."); // Debug
  // Créer le mapping NOC/Code -> Nom de pays depuis les données de population
  const countryNameMapping = createCountryNameMapping(populationData);
  console.log("Country name mapping created:", countryNameMapping.size); // Debug
  
  // Collecter tous les NOC uniques depuis les données des athlètes
  const countryMap = new Map();
  
  athleteData.forEach(d => {
    if (!countryMap.has(d.NOC)) {
      // Chercher le nom du pays dans le mapping de population
      const countryName = countryNameMapping.get(d.NOC) || d.NOC;
      
      countryMap.set(d.NOC, {
        noc: d.NOC,
        name: countryName,
        iso2: getNocFlag(d.NOC)
      });
    }
  });
  
  // Convertir en tableau et trier par nom de pays
  const countries = Array.from(countryMap.values()).sort((a, b) => 
    a.name.localeCompare(b.name)
  );
  
  // Mettre à jour la liste des pays disponibles
  allAvailableCountries = new Set(countries.map(c => c.noc));
  activeCountries = new Set(); // Aucun pays sélectionné par défaut
  countryFilterEnabled = false; // Filtre désactivé par défaut
  
  console.log("Countries loaded:", countries.length); // Debug
  
  // Créer les éléments HTML
  const countryList = d3.select("#countryList");
  countryList.selectAll("*").remove(); // Clear existing items
  
  console.log("Creating country buttons..."); // Debug
  
  countries.forEach(country => {
    const countryNoc = country.noc; // Capturer le NOC dans la closure
    const btn = countryList.append("button")
      .attr("class", "country-btn")
      .attr("data-noc", countryNoc)
      .attr("type", "button")
      .on("click", function(event) {
        event.preventDefault();
        event.stopPropagation();
        console.log("Button clicked:", countryNoc); // Debug
        toggleCountry(countryNoc);
        // Toggle la classe active
        d3.select(this).classed("active", activeCountries.has(countryNoc));
      });
    
    btn.append("span")
      .attr("class", "country-flag")
      .text(getFlagEmoji(country.iso2));
    
    btn.append("div")
      .attr("class", "country-names")
      .text(country.name); // Affiche le nom du pays
  });
  
  // Setup search input
  d3.select("#countrySearchInput").on("input", function() {
    const searchTerm = this.value.toLowerCase();
    console.log("Searching for:", searchTerm); // Debug
    
    // Filtrer les boutons de pays selon le terme de recherche
    d3.selectAll(".country-btn").each(function() {
      const btn = d3.select(this);
      const countryName = btn.select(".country-names").text().toLowerCase();
      
      if (countryName.includes(searchTerm)) {
        btn.style("display", "flex"); // Afficher
      } else {
        btn.style("display", "none"); // Cacher
      }
    });
  });
  
  // Setup deselect all button
  d3.select("#deselectAllBtn").on("click", function() {
    countryFilterEnabled = false;
    activeCountries.clear();
    d3.selectAll(".country-btn").classed("active", false);
    updateAvailableYears();
    recalculateScalesForFilters(currentSeason);
    const availableYears = currentSeason === "Summer" ? filteredSummerYears : filteredWinterYears;
    const currentIndex = +d3.select("#yearSlider").property("value");
    const currentYear = availableYears[currentIndex];
    updateChart(currentYear, currentSeason);
  });
}

// Fonction pour obtenir l'emoji du drapeau à partir du code ISO2
function getFlagEmoji(iso2) {
  if (!iso2 || iso2.length !== 2) return "🏳️";
  const codePoints = iso2
    .toUpperCase()
    .split('')
    .map(char => 127397 + char.charCodeAt());
  return String.fromCodePoint(...codePoints);
}

// Fonction pour initialiser les filtres de continents
function initializeContinentFilters() {
  const continents = [
    { name: "Africa", color: "#e74c3c" },
    { name: "Americas", color: "#3498db" },
    { name: "Asia", color: "#f39c12" },
    { name: "Europe", color: "#2ecc71" },
    { name: "Oceania", color: "#9b59b6" }
  ];
  
  const continentList = d3.select("#continentList");
  continentList.selectAll("*").remove();
  
  continents.forEach(continent => {
    const continentName = continent.name;
    const btn = continentList.append("button")
      .attr("class", "continent-btn")
      .attr("data-continent", continentName)
      .attr("type", "button")
      .on("click", function(event) {
        event.preventDefault();
        event.stopPropagation();
        toggleContinent(continentName);
        d3.select(this).classed("active", activeContinents.has(continentName));
      });
    
    btn.append("div")
      .attr("class", "continent-color")
      .style("background-color", continent.color);
    
    btn.append("div")
      .attr("class", "continent-name")
      .text(continent.name);
  });
}

// Fonction pour basculer l'état d'un continent
function toggleContinent(continent) {
  console.log("toggleContinent called with:", continent);
  try {
    if (activeContinents.has(continent)) {
      activeContinents.delete(continent);
    } else {
      activeContinents.add(continent);
    }
    
    // Activer le filtre dès qu'un continent est sélectionné
    continentFilterEnabled = activeContinents.size > 0;
    console.log("Continent filter enabled:", continentFilterEnabled, "Active continents:", activeContinents.size);
    
    // Recalculer les années disponibles
    updateAvailableYears();
    
    // Recalculer les échelles avec les nouveaux filtres
    recalculateScalesForFilters(currentSeason);
    
    // Mettre à jour le graphique
    const availableYears = currentSeason === "Summer" ? filteredSummerYears : filteredWinterYears;
    const currentIndex = +d3.select("#yearSlider").property("value");
    const currentYear = availableYears[currentIndex];
    console.log("Updating chart with year:", currentYear);
    updateChart(currentYear, currentSeason);
  } catch (error) {
    console.error("Error in toggleContinent:", error);
  }
}

// Fonction pour basculer l'état d'un pays
function toggleCountry(noc) {
  console.log("toggleCountry called with:", noc); // Debug
  try {
    if (activeCountries.has(noc)) {
      activeCountries.delete(noc);
    } else {
      activeCountries.add(noc);
    }
    
    // Activer le filtre dès qu'un pays est sélectionné
    countryFilterEnabled = activeCountries.size > 0;
    console.log("Country filter enabled:", countryFilterEnabled, "Active countries:", activeCountries.size); // Debug
    
    // Recalculer les années disponibles pour la saison courante
    updateAvailableYears();
    
    // Recalculer les échelles avec les nouveaux filtres
    recalculateScalesForFilters(currentSeason);
    
    // Mettre à jour le graphique avec l'année courante du slider
    const availableYears = currentSeason === "Summer" ? filteredSummerYears : filteredWinterYears;
    const currentIndex = +d3.select("#yearSlider").property("value");
    const currentYear = availableYears[currentIndex];
    console.log("Updating chart with year:", currentYear); // Debug
    updateChart(currentYear, currentSeason);
  } catch (error) {
    console.error("Error in toggleCountry:", error);
  }
}

// Fonction pour mettre à jour les années disponibles selon les filtres
function updateAvailableYears() {
  // Recalculer pour les deux saisons
  ["Summer", "Winter"].forEach(season => {
    const seasonYears = season === "Summer" ? summerYears : winterYears;
    const availableYears = [];
    
    seasonYears.forEach(year => {
      const chartData = ops.prepareChartData(athleteData, populationData, year, season);
      // Filtrer par continents actifs ET pays actifs (si les filtres sont activés)
      const filteredData = chartData.data.filter(d => {
        const continentMatch = !continentFilterEnabled || activeContinents.has(d.continent);
        const countryMatch = !countryFilterEnabled || activeCountries.has(d.noc);
        return continentMatch && countryMatch;
      });
      
      // Ajouter l'année seulement si elle a des données après filtrage
      if (filteredData.length > 0) {
        availableYears.push(year);
      }
    });
    
    if (season === "Summer") {
      filteredSummerYears = availableYears;
    } else {
      filteredWinterYears = availableYears;
    }
  });
  
  // Mettre à jour le slider pour la saison courante
  // updateSliderForCurrentSeason(); // Commenté car cette fonction n'est pas globale
  // À la place, on met à jour manuellement le slider
  const yearSlider = d3.select("#yearSlider");
  const yearDisplay = d3.select("#yearDisplay");
  const availableYearsForSeason = currentSeason === "Summer" ? filteredSummerYears : filteredWinterYears;
  
  if (availableYearsForSeason.length > 0) {
    const minYear = d3.min(availableYearsForSeason);
    yearSlider
      .attr("min", 0)
      .attr("max", availableYearsForSeason.length - 1)
      .attr("step", 1);
    
    // Garder l'index actuel si possible, sinon revenir à 0
    const currentIndex = +yearSlider.property("value");
    if (currentIndex >= availableYearsForSeason.length) {
      yearSlider.property("value", 0);
      yearDisplay.text(minYear);
    } else {
      yearDisplay.text(availableYearsForSeason[currentIndex]);
    }
  }
}

// Fonction pour recalculer les échelles basées sur les continents actifs
function recalculateScalesForFilters(season) {
  const seasonYears = season === "Summer" ? filteredSummerYears : filteredWinterYears;
  
  filteredMaxParticipants[season] = 0;
  filteredMaxPopulation[season] = 0;
  filteredMaxMedals[season] = 0;
  
  seasonYears.forEach(year => {
    const chartData = ops.prepareChartData(athleteData, populationData, year, season);
    // Filtrer par continents actifs ET pays actifs (si les filtres sont activés)
    const filteredData = chartData.data.filter(d => {
      const continentMatch = !continentFilterEnabled || activeContinents.has(d.continent);
      const countryMatch = !countryFilterEnabled || activeCountries.has(d.noc);
      return continentMatch && countryMatch;
    });
    
    if (filteredData.length > 0) {
      const maxParticipants = d3.max(filteredData, d => d.participants);
      const maxPopulation = d3.max(filteredData, d => d.population);
      const maxMedals = d3.max(filteredData, d => d.medals);
      
      if (maxParticipants > filteredMaxParticipants[season]) {
        filteredMaxParticipants[season] = maxParticipants;
      }
      if (maxPopulation > filteredMaxPopulation[season]) {
        filteredMaxPopulation[season] = maxPopulation;
      }
      if (maxMedals > filteredMaxMedals[season]) {
        filteredMaxMedals[season] = maxMedals;
      }
    }
  });
}

// Initialize chart elements
function initializeChart() {
  // Create a defs section for patterns

    .attr("class", "bubbles-group")

  // Les masques blancs seront ajoutés APRÈS les bulles pour cacher tout débordement
  // Ils sont dans le groupe svg (pas svgContainer) pour être au bon endroit
  
  // Masque en bas (couvre la zone sous le graphique)
  svg.append("rect")
    .attr("class", "bottom-mask")
    .attr("x", -margin.left)
    .attr("y", height)
    .attr("width", width + margin.left + margin.right)
    .attr("height", margin.bottom)
    .attr("fill", "white")
    .attr("pointer-events", "none");
  
  // Masque à gauche (couvre la zone à gauche du graphique)
  svg.append("rect")
    .attr("class", "left-mask")
    .attr("x", -margin.left)
    .attr("y", -margin.top)
    .attr("width", margin.left)
    .attr("height", height + margin.top)
    .attr("fill", "white")
    .attr("pointer-events", "none");
  
  // Masque en haut (couvre la zone au-dessus du graphique)
  svg.append("rect")
    .attr("class", "top-mask")
    .attr("x", -margin.left)
    .attr("y", -margin.top)
    .attr("width", width + margin.left + margin.right)
    .attr("height", margin.top)
    .attr("fill", "white")
    .attr("pointer-events", "none");
  
  // Masque à droite (couvre la zone à droite du graphique)
  svg.append("rect")
    .attr("class", "right-mask")
    .attr("x", width)
    .attr("y", -margin.top)
    .attr("width", margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .attr("fill", "white")
    .attr("pointer-events", "none");
  
  // Add axes groups (AFTER masking rectangles, so they're on top)
  xAxisGroup = svg.append("g")

  yAxisGroup = svg.append("g")
    .attr("class", "y-axis");
  
  // Add axis labels (AFTER axes, so they're always visible)
  svg.append("text")
    .attr("class", "axis-label x-label")
    .attr("text-anchor", "middle")

    .attr("y", height + 40)

  svg.append("text")

    .attr("x", -height / 2)

    .attr("text-anchor", "middle")
    .attr("x", width / 2)
    .attr("y", -10);
  
  // Initialize color scale
  colorScale = d3.scaleOrdinal()
    .domain(["Africa", "Americas", "Asia", "Europe", "Oceania", "Unknown"])
    .range(["#e74c3c", "#3498db", "#f39c12", "#2ecc71", "#9b59b6", "#95a5a6"]);
  
  // Note: Les rectangles de masquage sont maintenant gérés dans le groupe svg
  // (x-axis-mask et y-axis-mask) pour masquer les bulles qui débordent
  // Ces rectangles restent synchronisés avec le zoom et sont toujours au bon endroit
  
  // Setup zoom behavior
  setupZoom();
}

// Setup zoom and pan functionality
let zoomBehavior;

function setupZoom() {
  // Create zoom behavior
  zoomBehavior = d3.zoom()
    .scaleExtent([1, 100])  // Limite: zoom min 1x (normal), zoom max 100x
    .extent([[0, 0], [width, height]])
    .translateExtent([[0, 0], [width, height]])  // Empêche de sortir des limites du graphique
    .on("zoom", zoomed);
  
  // Create an invisible rectangle to capture zoom/pan events on the chart area
  const zoomRect = svg.append("rect")
    .attr("class", "zoom-rect")
    .attr("width", width)
    .attr("height", height)
    .style("fill", "none")
    .style("pointer-events", "all")
    .style("cursor", "grab")
    .on("mousedown", function() {
      d3.select(this).style("cursor", "grabbing");
    })
    .on("mouseup", function() {
      d3.select(this).style("cursor", "grab");
    })
    .on("click", function(event) {
      // Déselectionner la bulle si on clique sur le fond
      if (event.target === this && selectedBubble) {
        resetSelectedBubble();
      }
    })
    .call(zoomBehavior);
  
  // Ensure proper z-order: bubbles < masking rectangles < axes < labels
  // This ensures bubbles are always hidden outside the chart area
  svg.select(".bubbles-group").raise();
  // Lever tous les masques au-dessus des bulles
  svg.selectAll(".bottom-mask, .left-mask, .top-mask, .right-mask").raise();
  // Puis les axes au-dessus des masques
  svg.select(".x-axis").raise();
  svg.select(".y-axis").raise();
  // Ensure labels and title are always on top
  svg.selectAll(".axis-label").raise();
  svg.select(".title").raise();
  
  function zoomed(event) {
    currentZoomTransform = event.transform;
    
    // Apply transform to bubbles
    bubblesGroup.attr("transform", event.transform);
    
    // Update axes with rescaled domains
    const newXScale = event.transform.rescaleX(xScale);
    const newYScale = event.transform.rescaleY(yScale);
    
    xAxisGroup.call(d3.axisBottom(newXScale));
    yAxisGroup.call(d3.axisLeft(newYScale));
  }
}

// Reset zoom to identity (no zoom)
function resetZoom() {
  if (zoomBehavior) {
    svg.select(".zoom-rect")
      .transition()
      .duration(750)
      .call(zoomBehavior.transform, d3.zoomIdentity);
  }
}

// Fonction pour réinitialiser la bulle sélectionnée
function resetSelectedBubble() {
  if (selectedBubble) {
    const bubbleElement = d3.select(selectedBubble);
    const bubbleData = bubbleElement.datum();
    
    // Retirer le style de sélection
    bubbleElement
      .style("filter", null);
    
    // Réorganiser toutes les bulles dans l'ordre de tri (par population)
    bubblesGroup.selectAll("circle")
      .sort((a, b) => b.population - a.population);
    
    selectedBubble = null;
  }
}

// Fonction pour sélectionner une bulle
function selectBubble(element, d) {
  // Si on clique sur la bulle déjà sélectionnée, on la déselectionne
  if (selectedBubble === element) {
    resetSelectedBubble();
    return;
  }
  
  // Réinitialiser la bulle précédemment sélectionnée
  resetSelectedBubble();
  
  // Sélectionner la nouvelle bulle
  selectedBubble = element;
  
  // Mettre la bulle au premier plan
  d3.select(element).raise();
  
  // Appliquer un style visuel pour montrer la sélection (sans agrandir la bordure)
  d3.select(element)
    .style("filter", "drop-shadow(0 0 8px rgba(0,0,0,0.5))");
}

// Fonction pour démarrer la lecture automatique
function startAutoPlay() {
  // Empêcher de démarrer plusieurs intervalles
  if (autoPlayInterval) return;
  
  const yearSlider = d3.select("#yearSlider");
  
  autoPlayInterval = setInterval(() => {
    const availableYears = currentSeason === "Summer" ? filteredSummerYears : filteredWinterYears;
    const currentIndex = +yearSlider.property("value");
    let nextIndex = currentIndex + autoPlayDirection;
    
    // Vérifier si on atteint une extrémité
    if (nextIndex >= availableYears.length || nextIndex < 0) {
      // Arrêter la lecture automatique quand on atteint une extrémité
      stopAutoPlay();
      return;
    }
    
    // Mettre à jour le slider et le graphique
    yearSlider.property("value", nextIndex);
    const newYear = availableYears[nextIndex];
    d3.select("#yearDisplay").text(newYear);
    updateChart(newYear, currentSeason);
    updateNavigationButtons();
  }, autoPlaySpeed);
}

// Fonction pour arrêter la lecture automatique
function stopAutoPlay() {
  if (autoPlayInterval) {
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
  }
  // Retirer la classe active de tous les boutons de lecture
  d3.select("#playForwardBtn").classed("active", false);
  d3.select("#playBackwardBtn").classed("active", false);
}

// Function to create or update flag patterns
function createFlagPattern(noc) {
  const patternId = `flag-${noc}`;
  const iso2 = getNocFlag(noc);
  
  // Check if pattern already exists
  if (svg.select(`#${patternId}`).empty()) {
    const defs = svg.select("defs");
    const pattern = defs.append("pattern")
      .attr("id", patternId)
      .attr("width", 1)
      .attr("height", 1)
      .attr("patternContentUnits", "objectBoundingBox");
    
    // Add the flag image - use a larger viewBox to ensure proper cropping
    pattern.append("image")
      .attr("href", `https://flagcdn.com/${iso2}.svg`)
      .attr("x", -0.25)
      .attr("y", -0.25)
      .attr("width", 1.5)
      .attr("height", 1.5)
      .attr("preserveAspectRatio", "xMidYMid slice");
  }
  
  return `url(#${patternId})`;
}

function updateChart(selectedYear, season) {
  // Réinitialiser la sélection lors du changement de données
  resetSelectedBubble();
  
  // Utilisation des fonctions de operations.js pour préparer les données
  const chartData = ops.prepareChartData(athleteData, populationData, selectedYear, season);
  let combinedData = chartData.data;
  
  // Filtrer les données selon les continents ET pays actifs (si les filtres sont activés)
  combinedData = combinedData.filter(d => {
    const continentMatch = !continentFilterEnabled || activeContinents.has(d.continent);
    const countryMatch = !countryFilterEnabled || activeCountries.has(d.noc);
    return continentMatch && countryMatch;
  });
  
  // Initialize chart elements if not already done
  if (!xAxisGroup) {
    initializeChart();
  }
  
  // Vérifier s'il y a des données
  if (combinedData.length === 0) {
    // Cacher les bulles mais garder le graphique
    bubblesGroup.selectAll("circle").remove();
    
    // Afficher un message
    let noDataText = svg.select(".no-data-text");
    if (noDataText.empty()) {
      noDataText = svg.append("text")
        .attr("class", "no-data-text")
        .attr("x", width / 2)
        .attr("y", height / 2)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("fill", "#666");
    }
    noDataText.text(`Aucune donnée disponible pour les continents sélectionnés`);
    return;
  } else {
    // Supprimer le message "no data" s'il existe
    svg.select(".no-data-text").remove();
  }
  
  // Create flag patterns for all countries in the data
  combinedData.forEach(d => {
    createFlagPattern(d.noc);
  });
  
  // Utiliser les échelles calculées pour la saison avec les filtres actifs
  xScale = d3.scaleLinear()
    .domain([0, filteredMaxParticipants[season] * 1.1])
    .range([0, width]);
  
  yScale = d3.scaleLinear()
    .domain([0, filteredMaxMedals[season] * 1.1])
    .range([height, 0]);
  
  // Utiliser les valeurs globales pour la taille des bulles (population)
  // Cela garantit que la taille reste cohérente indépendamment des filtres
  zScale = d3.scaleSqrt()
    .domain([globalMinPopulation[season], globalMaxPopulation[season]])
    .range([5, 50]);
  
  // Reset zoom when changing data
  resetZoom();
  
  // Update axes with transition
  xAxisGroup.transition()
    .duration(750)
    .call(d3.axisBottom(xScale));
  
  yAxisGroup.transition()
    .duration(750)
    .call(d3.axisLeft(yScale));
  
  // Update title
  const seasonText = season === "Summer" ? "Été" : "Hiver";
  titleElement.text(`Jeux Olympiques ${seasonText} ${selectedYear}`);
  
  // Trier les données par population (du plus grand au plus petit)
  // Les plus grosses bulles seront dessinées en premier (arrière-plan)
  const sortedData = combinedData.sort((a, b) => b.population - a.population);
  
  // Update bubbles with smooth transitions
  const bubbles = bubblesGroup
    .selectAll("circle")
    .data(sortedData, d => d.noc); // Use noc as key for object constancy
  
  // Exit: remove old bubbles
  bubbles.exit()
    .transition()
    .duration(750)
    .attr("r", 0)
    .style("opacity", 0)
    .remove();
  
  // Enter: add new bubbles
  const bubblesEnter = bubbles.enter()
    .append("circle")
    .attr("class", "bubbles")
    .attr("cx", d => xScale(d.participants))
    .attr("cy", d => yScale(d.medals))
    .attr("r", 0)
    .style("fill", d => `url(#flag-${d.noc})`)
    .style("stroke", d => colorScale(d.continent))
    .style("stroke-width", "2px")
    .style("opacity", 0);
  
  // Update + Enter: transition all bubbles to new positions and sizes
  bubblesEnter.merge(bubbles)
    .on("mouseover", showTooltip)
    .on("mousemove", moveTooltip)
    .on("mouseleave", hideTooltip)
    .on("click", function(event, d) {
      event.stopPropagation(); // Empêche la propagation au zoomRect
      selectBubble(this, d);
    })
    .transition()
    .duration(400)
    .attr("cx", d => xScale(d.participants))
    .attr("cy", d => yScale(d.medals))
    .attr("r", d => zScale(d.population))
    .style("fill", d => `url(#flag-${d.noc})`)
    .style("stroke", d => colorScale(d.continent))
    .style("stroke-width", "2px")
    .style("opacity", 1);
}

</script>
